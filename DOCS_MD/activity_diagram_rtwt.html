<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Activity Diagram RTWT Mesin</title>
  <style>
    body {
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .diagram-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    svg {
      background: #ffffff;
      border: 1.5px solid #1e293b;
      border-radius: 8px;
      display: block;
    }

    .lane-title {
      font-weight: bold;
      font-size: 14px;
      fill: #0f172a;
    }

    .box-text {
      font-size: 11.5px;
      fill: #0f172a;
      text-anchor: middle;
    }

    .arrow-text {
      font-size: 11px;
      font-weight: bold;
      fill: #0f172a;
    }

    .arrow-text-reject {
      font-size: 10.5px;
      font-weight: bold;
      fill: #dc2626;
    }

    .arrow-text-reroute {
      font-size: 10.5px;
      font-weight: bold;
      fill: #d97706;
    }

    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 14px;
      font-size: 12px;
      color: #334155;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <div class="diagram-card">
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background:#0f172a;"></span> Alur Utama (Standar)</div>
      <div class="legend-item"><span class="dot" style="background:#dc2626;"></span> Loop Reject 1: Assigner ke White
        Tag</div>
      <div class="legend-item"><span class="dot" style="background:#d97706;"></span> Loop Reject 2: Sub-Divisi Reroute
        ke Assigner</div>
    </div>

    <svg width="830" height="970" viewBox="0 0 830 970" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
        </marker>
      </defs>

      <!-- Garis Pembatas Kolom (Swimlanes) -->
      <line x1="270" y1="0" x2="270" y2="970" stroke="#0f172a" stroke-width="1.5" />
      <line x1="535" y1="0" x2="535" y2="970" stroke="#0f172a" stroke-width="1.5" />
      <line x1="0" y1="50" x2="830" y2="50" stroke="#0f172a" stroke-width="1.5" />

      <!-- Header Kolom -->
      <text x="135" y="32" text-anchor="middle" class="lane-title">Operator (Form AM)</text>
      <text x="402" y="32" text-anchor="middle" class="lane-title">Sistem (API &amp; Pipeline)</text>
      <text x="682" y="32" text-anchor="middle" class="lane-title">Tim Teknik (Maintenance)</text>

      <!-- ==================== LANE 1: OPERATOR ==================== -->
      <!-- Start Node -->
      <circle cx="135" cy="80" r="10" fill="#0f172a" />
      <line x1="135" y1="90" x2="135" y2="115" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />

      <!-- Aksi 1: Inspeksi -->
      <rect x="55" y="115" width="160" height="42" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="135" y="141" class="box-text">Inspeksi Part Mesin</text>
      <line x1="135" y1="157" x2="135" y2="190" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />

      <!-- Decision 1: Kondisi Part -->
      <polygon points="135,190 195,220 135,250 75,220" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="135" y="224" class="box-text">Kondisi Part?</text>

      <!-- CABANG OK -->
      <line x1="75" y1="220" x2="61" y2="220" stroke="#0f172a" stroke-width="1.4" />
      <line x1="61" y1="220" x2="61" y2="270" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />
      <text x="42" y="213" class="arrow-text">OK</text>

      <!-- Kotak AM Selesai / White Tag -->
      <rect x="10" y="270" width="115" height="46" rx="8" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="67" y="289" class="box-text">AM Selesai</text>
      <text x="67" y="304" class="box-text" style="font-size:10px;fill:#475569;">(White Tag Mandiri)</text>

      <!-- End Node OK -->
      <line x1="67" y1="316" x2="67" y2="345" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />
      <circle cx="67" cy="355" r="9" fill="none" stroke="#0f172a" stroke-width="1.4" />
      <circle cx="67" cy="355" r="5.5" fill="#0f172a" />

      <!-- CABANG NOK -->
      <line x1="135" y1="250" x2="135" y2="400" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />
      <text x="143" y="272" class="arrow-text">NOK</text>

      <!-- Kotak Input Tag & Foto -->
      <rect x="25" y="400" width="220" height="50" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="135" y="421" class="box-text">Input Tag (Red / White),</text>
      <text x="135" y="438" class="box-text">No. WR &amp; Foto Temuan</text>

      <!-- Penyeberangan ke LANE 2 (Sistem) -->
      <line x1="245" y1="425" x2="310" y2="425" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)" />
      <text x="252" y="417" class="arrow-text" style="font-size:10px;">HTTP POST</text>


      <!-- ==================== LANE 2: SISTEM ==================== -->
      <rect x="310" y="400" width="185" height="50" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="402" y="421" class="box-text">Terima Data API,</text>
      <text x="402" y="438" class="box-text">Generate Tiket (OPEN)</text>

      <!-- Penyeberangan ke LANE 3 (Teknik) -->
      <line x1="495" y1="425" x2="560" y2="425" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)" />
      <text x="500" y="417" class="arrow-text" style="font-size:10px;">Notifikasi</text>


      <!-- ==================== LANE 3: TIM TEKNIK ==================== -->
      <!-- 1. Lead Search & Klasifikasi -->
      <rect x="560" y="400" width="245" height="48" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="682" y="420" class="box-text">Lead / Assigner: Filter &amp;</text>
      <text x="682" y="436" class="box-text">Collective Assign (ASSIGNED)</text>

      <line x1="682" y1="448" x2="682" y2="475" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />

      <!-- DECISION 1: ASSIGNER CEK RED TAG -->
      <polygon points="682,475 745,498 682,521 619,498" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="682" y="502" class="box-text" style="font-size:10.5px;">Valid Red Tag?</text>

      <!-- LOOP REJECT 1: Bukan Red Tag -> Kembalikan ke White Tag Operator -->
      <path d="M 619 498 L 520 498 L 520 300 L 132 300" fill="none" stroke="#dc2626" stroke-width="1.8"
        stroke-dasharray="5,4" marker-end="url(#arrow-red)" />
      <text x="532" y="490" class="arrow-text-reject">Reject: White Tag</text>

      <!-- CABANG YES DECISION 1 -->
      <line x1="682" y1="521" x2="682" y2="545" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />
      <text x="690" y="537" class="arrow-text" style="font-size:10px;">Yes</text>

      <!-- 2. Deliver ke Sub-Dept sesuai Klasifikasi -->
      <rect x="560" y="545" width="245" height="52" rx="10" fill="#fcfcfc" stroke="#0f172a" stroke-width="1.4" />
      <text x="682" y="565" class="box-text" style="font-weight:bold;font-size:11px;">Deliver ke Sub-Dept
        Terkait:</text>
      <text x="682" y="582" class="box-text" style="font-size:10px;fill:#334155;">• MTC Mesin | • Utility | •
        Bengkel/Sparepart</text>

      <line x1="682" y1="597" x2="682" y2="625" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />

      <!-- DECISION 2: SUB-DEPT CEK WEWENANG -->
      <polygon points="682,625 750,650 682,675 614,650" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="682" y="654" class="box-text" style="font-size:10.5px;">Sesuai Sub-Divisi?</text>

      <!-- LOOP REJECT 2: Bukan Sub-Divisi Saya -> Re-Route kembali ke Assigner -->
      <path d="M 750 650 L 815 650 L 815 424 L 805 424" fill="none" stroke="#d97706" stroke-width="1.8"
        stroke-dasharray="5,4" marker-end="url(#arrow-orange)" />
      <text x="758" y="642" class="arrow-text-reroute">Reject: Sub-Divisi Lain</text>

      <!-- CABANG YES DECISION 2 -->
      <line x1="682" y1="675" x2="682" y2="700" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />
      <text x="690" y="691" class="arrow-text" style="font-size:10px;">Yes</text>

      <!-- 3. Teknisi Sub-Dept Perbaiki Mesin -->
      <rect x="560" y="700" width="245" height="48" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="682" y="721" class="box-text">Teknisi Sub-Dept Perbaiki Mesin</text>
      <text x="682" y="736" class="box-text" style="font-size:10px;fill:#64748b;">(Status: IN PROGRESS)</text>

      <line x1="682" y1="748" x2="682" y2="774" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />

      <!-- 4. Upload Bukti Perbaikan -->
      <rect x="560" y="774" width="245" height="48" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="682" y="794" class="box-text">Upload Foto Bukti Sesudah</text>
      <text x="682" y="809" class="box-text">&amp; Uraian Tindakan</text>

      <line x1="682" y1="822" x2="682" y2="846" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />

      <!-- Decision 3: Verifikasi Teknik -->
      <polygon points="682,846 742,870 682,894 622,870" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="682" y="874" class="box-text" style="font-size:11px;">Verifikasi?</text>

      <!-- Loop Revisi Verifikasi -->
      <path d="M 742 870 L 815 870 L 815 724 L 805 724" fill="none" stroke="#0f172a" stroke-width="1.4"
        marker-end="url(#arrow)" />
      <text x="750" y="862" class="arrow-text">Revisi</text>

      <!-- Cabang Valid -> Balik ke LANE 2 (Close) -->
      <line x1="622" y1="870" x2="495" y2="870" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)" />
      <text x="540" y="862" class="arrow-text">Valid</text>


      <!-- ==================== LANE 2: CLOSE & DASHBOARD ==================== -->
      <rect x="310" y="846" width="185" height="48" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.4" />
      <text x="402" y="866" class="box-text" style="font-weight:bold;">CLOSE oleh TEKNIK</text>
      <text x="402" y="881" class="box-text" style="font-size:10px;fill:#64748b;">(Status: CLOSED)</text>

      <line x1="402" y1="894" x2="402" y2="920" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)" />

      <!-- Final End Node -->
      <circle cx="402" cy="930" r="10" fill="none" stroke="#0f172a" stroke-width="1.4" />
      <circle cx="402" cy="930" r="6" fill="#0f172a" />
      <text x="402" y="953" class="box-text" style="font-size:10px;fill:#475569;">(Update Dashboard KPI % Closed)</text>
    </svg>
  </div>

</body>

</html>
